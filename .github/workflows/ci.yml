name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly: catches upstream image changes

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate throwaway secrets
        run: ./scripts/gen-secrets.sh
      - name: docker compose config
        run: docker compose config -q
      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh backup/*.sh firewall/*.sh
      - name: Caddyfile
        run: >
          docker run --rm -v "$PWD/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
          -v "$PWD/secrets/lab-ca.crt:/etc/caddy/lab-ca/root.crt:ro"
          -v "$PWD/secrets/lab-ca.key:/etc/caddy/lab-ca/root.key:ro"
          caddy:2.10 caddy validate --config /etc/caddy/Caddyfile
      - name: Prometheus config and alert rules
        run: >
          docker run --rm --entrypoint promtool -v "$PWD/prometheus:/etc/prometheus:ro"
          prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
      - name: Alertmanager config
        run: >
          docker run --rm --entrypoint amtool -v "$PWD/alertmanager:/etc/alertmanager:ro"
          prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.yml
      - name: Loki config
        run: >
          docker run --rm -v "$PWD/loki:/etc/loki:ro"
          grafana/loki:3.5.3 -config.file=/etc/loki/loki.yml -verify-config
      - name: Alloy config
        run: docker run --rm -v "$PWD/alloy:/etc/alloy:ro" grafana/alloy:v1.10.0 fmt /etc/alloy/config.alloy
      - name: No secrets committed
        run: |
          test -z "$(git ls-files .env secrets)"
          if git grep -nE '(BEGIN (EC |RSA )?PRIVATE KEY|POSTGRES_PASSWORD=.{8,})' -- ':!*.md' ':!scripts/gen-secrets.sh' ':!.github'; then
            echo "possible secret committed"; exit 1
          fi

  firewall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load nftables.conf in a throwaway namespace and test it
        run: ./firewall/test-firewall.sh

  e2e:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          ./scripts/gen-secrets.sh
          docker compose up -d --build
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' ism-crm-api-1 2>/dev/null)" = healthy ] && break
            sleep 5
          done
          docker compose ps
          sleep 45   # first scrapes, first backup, first log lines
      - name: Verify
        run: ./scripts/verify.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-report
          path: reports/
