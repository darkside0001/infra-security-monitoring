#!/usr/sbin/nft -f
# Host firewall for the server that runs this stack.
#
# Install: cp firewall/nftables.conf /etc/nftables.conf
#          cp firewall/admin-net.nft /etc/nftables.d/admin-net.nft   (edit it)
#          nft -c -f /etc/nftables.conf && systemctl enable --now nftables
#
# Why no `flush ruleset`: Docker keeps its own NAT/filter rules in nftables
# (through iptables-nft). Flushing everything would cut every container off
# the network. This file only owns the table `host_firewall`.
#
# Important: traffic to *published* container ports is DNATed and goes
# through FORWARD, not INPUT, so these INPUT rules do not protect it. That is
# why only Caddy publishes ports (80/443), and why firewall/docker-user.sh
# restricts the DOCKER-USER chain as well. See docs/adr/0004-firewall.md.

include "/etc/nftables.d/admin-net.nft"

table inet host_firewall
delete table inet host_firewall

table inet host_firewall {
	set ssh_offenders {
		type ipv4_addr
		flags dynamic, timeout
		timeout 15m
	}

	chain input {
		type filter hook input priority filter; policy drop;

		ct state established,related accept
		ct state invalid counter drop
		iif "lo" accept

		# ICMP is needed for path MTU discovery; rate limited, not blocked.
		ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } limit rate 10/second accept
		ip6 nexthdr icmpv6 icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept

		# SSH only from the admin network (VPN), and an address that opens more
		# than 10 new connections a minute is dropped for 15 minutes.
		ip saddr @ssh_offenders counter drop
		tcp dport 22 ip saddr $ADMIN_NET ct state new \
			meter ssh_rate { ip saddr limit rate over 10/minute } \
			add @ssh_offenders { ip saddr } counter drop
		tcp dport 22 ip saddr $ADMIN_NET accept

		# WireGuard for the admin VPN.
		udp dport 51820 accept

		# Public web traffic (also handled by DOCKER-USER, see header).
		tcp dport { 80, 443 } accept

		limit rate 5/minute burst 10 packets log prefix "nft-input-drop: " level info
		counter drop
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
