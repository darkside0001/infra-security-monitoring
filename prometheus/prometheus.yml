global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: lab

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]

  - job_name: alertmanager
    static_configs: [{ targets: ["alertmanager:9093"] }]

  - job_name: caddy
    static_configs: [{ targets: ["caddy:2020"] }]

  - job_name: node
    static_configs: [{ targets: ["node-exporter:9100"] }]

  - job_name: loki
    static_configs: [{ targets: ["loki:3100"] }]

  - job_name: alloy
    static_configs: [{ targets: ["alloy:12345"] }]

  - job_name: grafana
    static_configs: [{ targets: ["grafana:3000"] }]

  # Black-box checks: what a user sees, through the proxy, with TLS validation.
  - job_name: blackbox-https
    metrics_path: /probe
    params:
      module: [https_2xx]
    static_configs:
      - targets:
          - https://crm.lab.test/health
          - https://grafana.lab.test/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: blackbox-http-redirect
    metrics_path: /probe
    params:
      module: [http_redirects_to_https]
    static_configs:
      - targets: ["http://crm.lab.test/"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
