<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="980" height="560" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
  </defs>
  <!-- Internet -->
  <rect x="20" y="230" width="110" height="60" rx="8" fill="#f2f2f2" stroke="#888"/>
  <text x="75" y="256" text-anchor="middle" font-weight="600">Internet</text>
  <text x="75" y="274" text-anchor="middle" fill="#555">clients</text>
  <!-- host firewall -->
  <rect x="150" y="20" width="810" height="520" rx="12" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="165" y="42" fill="#c0392b" font-weight="600">Host: nftables (INPUT default drop, SSH from VPN only) + DOCKER-USER (only 80/443 forwarded)</text>
  <!-- edge -->
  <rect x="170" y="200" width="150" height="120" rx="10" fill="#fdecea" stroke="#c0392b"/>
  <text x="245" y="222" text-anchor="middle" font-weight="600">edge network</text>
  <rect x="185" y="235" width="120" height="70" rx="8" fill="#fff" stroke="#c0392b"/>
  <text x="245" y="258" text-anchor="middle" font-weight="600">Caddy</text>
  <text x="245" y="275" text-anchor="middle" fill="#555">TLS 1.2/1.3, HSTS</text>
  <text x="245" y="292" text-anchor="middle" fill="#555">:80 :443 only</text>
  <line x1="130" y1="260" x2="183" y2="260" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
  <!-- app -->
  <rect x="360" y="70" width="190" height="110" rx="10" fill="#eaf2fb" stroke="#2e6da4"/>
  <text x="455" y="92" text-anchor="middle" font-weight="600">app (internal)</text>
  <rect x="385" y="105" width="140" height="55" rx="8" fill="#fff" stroke="#2e6da4"/>
  <text x="455" y="128" text-anchor="middle" font-weight="600">crm-api</text>
  <text x="455" y="146" text-anchor="middle" fill="#555">FastAPI, non-root, ro fs</text>
  <line x1="305" y1="245" x2="383" y2="140" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
  <!-- db -->
  <rect x="600" y="60" width="340" height="130" rx="10" fill="#eef7ee" stroke="#3c8d40"/>
  <text x="770" y="82" text-anchor="middle" font-weight="600">db (internal)</text>
  <rect x="620" y="100" width="130" height="60" rx="8" fill="#fff" stroke="#3c8d40"/>
  <text x="685" y="125" text-anchor="middle" font-weight="600">PostgreSQL 17</text>
  <text x="685" y="143" text-anchor="middle" fill="#555">scram-sha-256</text>
  <rect x="790" y="100" width="130" height="60" rx="8" fill="#fff" stroke="#3c8d40"/>
  <text x="855" y="122" text-anchor="middle" font-weight="600">backup</text>
  <text x="855" y="139" text-anchor="middle" fill="#555">restic, encrypted</text>
  <text x="855" y="154" text-anchor="middle" fill="#555">+ restore test</text>
  <line x1="525" y1="132" x2="618" y2="130" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="788" y1="130" x2="752" y2="130" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
  <!-- mon -->
  <rect x="360" y="250" width="580" height="200" rx="10" fill="#f6f0fb" stroke="#7d4ba3"/>
  <text x="650" y="272" text-anchor="middle" font-weight="600">mon (internal, no Internet)</text>
  <g>
    <rect x="380" y="290" width="120" height="50" rx="8" fill="#fff" stroke="#7d4ba3"/><text x="440" y="312" text-anchor="middle" font-weight="600">Prometheus</text><text x="440" y="329" text-anchor="middle" fill="#555">10 alert rules</text>
    <rect x="520" y="290" width="120" height="50" rx="8" fill="#fff" stroke="#7d4ba3"/><text x="580" y="312" text-anchor="middle" font-weight="600">Alertmanager</text><text x="580" y="329" text-anchor="middle" fill="#555">-> Telegram/sink</text>
    <rect x="660" y="290" width="120" height="50" rx="8" fill="#fff" stroke="#7d4ba3"/><text x="720" y="312" text-anchor="middle" font-weight="600">Loki</text><text x="720" y="329" text-anchor="middle" fill="#555">logs + ruler</text>
    <rect x="800" y="290" width="120" height="50" rx="8" fill="#fff" stroke="#7d4ba3"/><text x="860" y="312" text-anchor="middle" font-weight="600">Grafana</text><text x="860" y="329" text-anchor="middle" fill="#555">login required</text>
    <rect x="380" y="370" width="120" height="50" rx="8" fill="#fff" stroke="#7d4ba3"/><text x="440" y="392" text-anchor="middle" font-weight="600">blackbox</text><text x="440" y="409" text-anchor="middle" fill="#555">TLS + header probes</text>
    <rect x="520" y="370" width="120" height="50" rx="8" fill="#fff" stroke="#7d4ba3"/><text x="580" y="392" text-anchor="middle" font-weight="600">node-exporter</text><text x="580" y="409" text-anchor="middle" fill="#555">host + backup metrics</text>
    <rect x="660" y="370" width="120" height="50" rx="8" fill="#fff" stroke="#7d4ba3"/><text x="720" y="392" text-anchor="middle" font-weight="600">Alloy</text><text x="720" y="409" text-anchor="middle" fill="#555">log shipper</text>
  </g>
  <line x1="305" y1="285" x2="378" y2="315" stroke="#7d4ba3" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="318" y="328" fill="#7d4ba3" font-size="11">metrics</text>
  <!-- dockerapi -->
  <rect x="600" y="470" width="340" height="55" rx="10" fill="#fff8e6" stroke="#b9770e"/>
  <text x="770" y="492" text-anchor="middle" font-weight="600">dockerapi (internal)</text>
  <text x="770" y="510" text-anchor="middle" fill="#555">Alloy -> docker-socket-proxy (GET only) -> docker.sock</text>
  <line x1="720" y1="420" x2="720" y2="468" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="170" y="520" fill="#555">Admin: SSH and Grafana only from the WireGuard subnet</text>
</svg>
